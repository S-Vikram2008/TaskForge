<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tasks</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="styles2.css">
</head>
<body class="body-dark">
    
        <nav class="navbar">
                <a href="dashboard.html"><span class="banner-welcome">TaskForge</span></a>
                <div class="nav-links">
                    <a class="dashboard" href="dashboard.html"><b>Dashboard</b></a>
                    <a class="task-all" href="all-tasks.html"><b>All Tasks</b></a>
                    <button class="dark-light-mode"><b>Light mode</b></button>
                    <button type="button" class="add-task-btn">Add Tasks</button>
                </div>
            
        </nav>
    

        <div class="title-picture">
            <div class="title">
                <p class="add-task-title">All Tasks</p>
                <p class="add-task-desc" style="font-size: 17px;letter-spacing: 1.5px;line-height: 20px;">Here are all your tasks. Keep going!</p>
            </div>
        </div>
        <br><br>
            
        
        
        <div class="details">
            <div class="total-tasks">
                <div class="pic">
                    <i class="fa-brands fa-microsoft" style="color: rgb(177, 151, 252);border-radius: 10px;font-size: 30px;"></i>
                </div>
                <div class="desc">
                    <div class="task-title">
                        <p style="line-height: 0.5px;color: white;">Total Tasks</p>
                    </div>
                    <div class="task-num">
                        <p class="total-task-num" style="line-height: 0.5px;font-size: 30px;color: white;">0</p>
                    </div>
                </div>
            </div>
            
            <div class="completed">
                <div class="pic">
                    <i class="fa-regular fa-circle-check" style="color: rgb(99, 230, 190);border-radius: 10px;font-size: 30px;"></i>
                </div>
                <div class="desc">
                    <div class="task-title">
                        <p style="line-height: 0.5px;color: white;">Completed</p>
                    </div>
                    <div class="task-num">
                        <p class="completed-task-num" style="line-height: 0.5px;font-size: 30px;color: white;">0</p>
                    </div>
                </div>
            </div>
            <div class="in-progress">
                <div class="pic">
                    <i class="fa-regular fa-clock" style="color: rgb(239, 126, 11);border-radius: 10px;font-size: 30px;"></i>
                </div>
                <div class="desc">
                    <div class="task-title">
                        <p style="line-height: 0.5px;color: white;">In Progress</p>
                    </div>
                    <div class="task-num">
                        <p class="in-progress-task-num" style="line-height: 0.5px;font-size: 30px;color: white;">0</p>
                    </div>
                </div>
            </div>
            <div class="pending">
                <div class="pic">
                    <i class="fa-regular fa-circle-pause" style="color: rgb(223, 19, 199);border-radius: 10px;font-size: 30px;"></i>
                </div>
                <div class="desc">
                    <div class="task-title">
                        <p style="line-height: 0.5px;color: white;">Pending</p>
                    </div>
                    <div class="task-num">
                        <p class="pending-task-num" style="line-height: 0.5px;font-size: 30px;color: white;">0</p>
                    </div>
                </div>
            </div>

            
        </div>
        <br><br>

        <div class="main">

        </div>

        <div class="add-task-off">
        <div class="box">

        
            <form class="add-task-form">
            <p style="color: white;"><b>Add New Task</b></p>
            <p style="color: white;">Fill in the details to create a task</p>

            <label for="task-title" style="color: white;">Task Title</label><br>
            <br>
            <input type="text" id="task-title" placeholder="e.g Finish Calculus assignment"><br>

            <p class="error-note" style="visibility: hidden;">Task title is mandatory</p>
            <label for="description" style="color: white;" >Description</label><br>
            <br>
            <textarea rows='10' cols='50' id="description" placeholder="Add more details (optional)"></textarea><br>
            <label for="priority" style="color: white;">Priority </label><br>
            <br>
            <div class="priority-buttons">
                <button type="button" class="priority-btn" value="High">High</button>
                <button type="button" class="priority-btn" value="Medium">Medium</button>
                <button type="button" class="priority-btn" value="Low">Low</button>
            </div>
            <br>
            <div class="status-duedate">
                <div class="status">
                    <label id="status" style="color: white;">Status</label>
                    <select class="dropdown-status">
                        <option selected>Pending</option>
                        <option>In Progress</option>
                    </select>
                </div>
                
                <div class="duedate">
                    <label for="due-date" class="duedate" style="color: white;">Due date</label>
                    <input type="date" id="due-date" class="menu-date">
                </div>
                
            </div>
            
            <br><br>
            <button type="button" class="cancel-btn">Cancel</button>
            <button type="button" class="submit-task-entry" style="background-color:#8B5CF6;">Add Task</button>

            </form>

        </div>

    </div>
<script src="script2.js" defer></script>
</body>
</html>
